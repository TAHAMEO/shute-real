<!doctype html><html><head><meta charset="utf-8"><title>Surface textures</title>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<style>html,body{margin:0;background:#222;color:#fff;font:12px sans-serif}#labels div{position:absolute;text-shadow:0 0 3px #000}</style></head><body><div id="labels"></div>
<script type="module">
import * as THREE from 'three';
import { TextureBaker } from '/js/engine/texture-baker.js';
import { TERRAIN_RECIPES, STRUCTURE_RECIPES } from '/js/world/surface-recipes.js';
const params = new URLSearchParams(location.search);
const set = params.get('set') || 'all';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping;
const baker = new TextureBaker(r);
const t0 = performance.now();
const recipes = [...(set !== 'structures' ? Object.values(TERRAIN_RECIPES) : []), ...(set !== 'terrain' ? Object.values(STRUCTURE_RECIPES) : [])];
const scene = new THREE.Scene();
const cols = 6, rows = Math.ceil(recipes.length / cols);
const cam = new THREE.OrthographicCamera(0, cols, 0, -rows, -10, 10);
const light = new THREE.DirectionalLight(0xffffff, 2.5); light.position.set(-1, 1, 1.2); scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
recipes.forEach((rec, i) => {
  const t = baker.bake(rec);
  const m = new THREE.MeshStandardMaterial({ map: t.map, normalMap: t.normalMap });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.96, 0.96), m);
  mesh.position.set((i % cols) + 0.5, -Math.floor(i / cols) - 0.5, 0);
  scene.add(mesh);
  const d = document.createElement('div');
  d.textContent = rec.name; d.style.left = ((i % cols) / cols * innerWidth + 6) + 'px'; d.style.top = (Math.floor(i / cols) / rows * innerHeight + 4) + 'px';
  document.getElementById('labels').appendChild(d);
});
console.log('baked', recipes.length, 'in', (performance.now() - t0).toFixed(0), 'ms');
r.render(scene, cam);
window.__READY = true;
</script></body></html>
